# Beskid platform — production lane (Coolify compose service).
# Secrets: OpenBao → scripts/ci/sync-runtime-env.sh → Coolify service env.
# Optional services: set COMPOSE_PROFILES=tracker,nexus,pckg on the Coolify service.
name: beskid-platform-production

services:
  site:
    image: ghcr.io/cyber-nomad-collective/beskid-site:${BESKID_RELEASE_TAG:?render an immutable release manifest}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  auth:
    image: ghcr.io/cyber-nomad-collective/beskid-auth:${BESKID_RELEASE_TAG:?render an immutable release manifest}
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      NODE_ENV: production
      PORT: "8090"
      AUTH_HUB_PUBLIC_URL: ${AUTH_HUB_PUBLIC_URL:-https://auth.beskid-lang.org}
      SESSION_SECRET: ${SESSION_SECRET:-}
      AUTH_HUB_SECRET: ${AUTH_HUB_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-}
      AUTH_SETUP_TOKEN: ${AUTH_SETUP_TOKEN:-}
      AUTH_DATA_DIR: /app/site/auth/data/runtime
      PLATFORM_SPEC_PUBLIC_URL: ${PLATFORM_SPEC_PUBLIC_URL:-https://spec.beskid-lang.org}
    volumes:
      - auth-data:/app/site/auth/data/runtime
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8090/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  memgraph:
    image: memgraph/memgraph-mage:3.6.2
    restart: unless-stopped
    expose:
      - "7687"
      - "7444"
    volumes:
      - memgraph-data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 0;' | mgconsole --host 127.0.0.1 --port 7687 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  platform-spec:
    image: ghcr.io/cyber-nomad-collective/beskid-platform-spec:${BESKID_RELEASE_TAG:?render an immutable release manifest}
    restart: unless-stopped
    depends_on:
      memgraph:
        condition: service_healthy
    expose:
      - "8460"
    environment:
      NODE_ENV: production
      PORT: "8460"
      MEMGRAPH_URI: ${MEMGRAPH_URI:-bolt://memgraph:7687}
      AUTH_HUB_PUBLIC_URL: ${AUTH_HUB_PUBLIC_URL:-https://auth.beskid-lang.org}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PLATFORM_SPEC_PUBLIC_URL: ${PLATFORM_SPEC_PUBLIC_URL:-https://spec.beskid-lang.org}
      GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER:-Cyber-Nomad-Collective}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-beskid}
      GITHUB_OAUTH_REPO_OWNER: ${GITHUB_OAUTH_REPO_OWNER:-Cyber-Nomad-Collective}
      GITHUB_OAUTH_REPO_NAME: ${GITHUB_OAUTH_REPO_NAME:-beskid}
      GITHUB_SYNC_TOKEN: ${GITHUB_SYNC_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      PLATFORM_SPEC_PAIRING_APPROVER_LOGIN: ${PLATFORM_SPEC_PAIRING_APPROVER_LOGIN:-}
      PLATFORM_SPEC_MODERATOR_LOGINS: ${PLATFORM_SPEC_MODERATOR_LOGINS:-}
      PLATFORM_SPEC_DATA_DIR: /app/site/platform-spec/data/runtime
    volumes:
      - platform-spec-data:/app/site/platform-spec/data/runtime
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8460/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  tracker:
    profiles: [tracker]
    image: ghcr.io/cyber-nomad-collective/beskid-tracker:${BESKID_RELEASE_TAG:?render an immutable release manifest}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      AUTH_HUB_PUBLIC_URL: ${AUTH_HUB_PUBLIC_URL:-https://auth.beskid-lang.org}
      GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER:-Cyber-Nomad-Collective}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-beskid}
      GITHUB_SYNC_TOKEN: ${GITHUB_SYNC_TOKEN:-}
      TRACKER_PAIRING_APPROVER_LOGIN: ${TRACKER_PAIRING_APPROVER_LOGIN:-}
      GITHUB_PUBLIC_READ_TOKEN: ${GITHUB_PUBLIC_READ_TOKEN:-}
      TRACKER_PUBLIC_URL: ${TRACKER_PUBLIC_URL:-https://tracker.beskid-lang.org}
      TRACKER_DATA_DIR: /app/beskid_tracker/data/runtime
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      ISSUES_SYNC_DISABLED: ${ISSUES_SYNC_DISABLED:-}
    volumes:
      - tracker-data:/app/beskid_tracker/data/runtime
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nexus:
    profiles: [nexus]
    image: ghcr.io/cyber-nomad-collective/beskid-nexus:${BESKID_RELEASE_TAG:?render an immutable release manifest}
    restart: unless-stopped
    expose:
      - "8452"
    environment:
      AUTH_HUB_PUBLIC_URL: ${AUTH_HUB_PUBLIC_URL:-https://auth.beskid-lang.org}
      GITNEXUS_HOME: /data/gitnexus
    volumes:
      - nexus-data:/data/gitnexus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8452/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    profiles: [pckg]
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pckgdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pckg_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pckgdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pckg:
    profiles: [pckg]
    image: ghcr.io/cyber-nomad-collective/beskid-pckg:${BESKID_RELEASE_TAG:?render an immutable release manifest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      HTTP_PORTS: ${HTTP_PORTS:-8082}
      AUTH_HUB_PUBLIC_URL: ${AUTH_HUB_PUBLIC_URL:-https://auth.beskid-lang.org}
      PCKG_PUBLIC_URL: ${PCKG_PUBLIC_URL:-https://pckg.beskid-lang.org}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-beskid-pckg}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=production}
      GITHUB_SYNC_TOKEN: ${GITHUB_SYNC_TOKEN:-}
      PCKG_PAIRING_APPROVER_LOGIN: ${PCKG_PAIRING_APPROVER_LOGIN:-}
      HttpClient__InternalBaseAddress: ${HTTP_CLIENT_INTERNAL_BASE_ADDRESS:-http://127.0.0.1:8082}
      ConnectionStrings__DefaultConnection: Host=${PCKG_DB_HOST:-postgres};Port=${PCKG_DB_PORT:-5432};Database=${POSTGRES_DB:-pckgdb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Pckg__Database__AutoMigrateOnStartup: ${PCKG_AUTO_MIGRATE_ON_STARTUP:-true}
      Storage__ArtifactsRootPath: /app/packages
      Captcha__RecaptchaV3SiteKey: ${CAPTCHA_RECAPTCHA_V3_SITE_KEY:-}
      Captcha__RecaptchaEnterpriseProjectId: ${CAPTCHA_RECAPTCHA_ENTERPRISE_PROJECT_ID:-}
      Captcha__RecaptchaEnterpriseApiKey: ${CAPTCHA_RECAPTCHA_ENTERPRISE_API_KEY:-}
      Captcha__MinimumScore: ${CAPTCHA_RECAPTCHA_MINIMUM_SCORE:-0.5}
    expose:
      - "8082"
    volumes:
      - pckg_packages:/app/packages
      - pckg_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  auth-data:
  memgraph-data:
  platform-spec-data:
  tracker-data:
  nexus-data:
  pckg_pg_data:
  pckg_packages:
  pckg_data:
